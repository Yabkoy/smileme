name: ci-macos

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build aplikacji
        working-directory: macos/Core
        run: swift build --product EmojiPickerApp

      - name: Testy
        working-directory: macos/Core
        run: swift test
