name: ci-shared

on:
  push:
  pull_request:

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zaleznosci
        working-directory: shared/tools
        run: npm install

      - name: Generowanie danych
        working-directory: shared/tools
        run: npm run data

      - name: Sprawdzenie liczby emoji
        working-directory: shared/tools
        run: node check_data.mjs

      - name: Generowanie grafik
        working-directory: shared/tools
        run: npm run assets

      - name: Sprawdzenie grafik
        run: |
          test -f shared/assets/twitter/1f600.png
          test -f shared/assets/google/1f600.png
